<!DOCTYPE html>
<html lang="bn">
<head>
    <!-- ── Google Analytics ─────────────────────────────── -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FFFEQVW4NK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FFFEQVW4NK');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazing HTML Projects — Banglay HTML</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & tokens ─────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue:        #0066CC;
      --blue-light:  #F0F9FF;
      --accent:      #E52E71;
      --accent-light:#FFF0F5;
      --text:        #1F2937;
      --text-muted:  #6B7280;
      --border:      #E5E7EB;
      --bg:          #F5F7FA;
      --white:       #ffffff;
      --radius-lg:   20px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    /* ── Top bar ─────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border-radius: 40px;
      background: var(--white);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-back:hover {
      border-color: var(--blue);
      color: var(--blue);
      background: var(--blue-light);
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* ── Intro note ───────────────────────────────────── */
    .intro-note {
      background: var(--accent-light);
      border: 1px solid #FBCFE8;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* ── Project grid ─────────────────────────────────── */
    .project-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .project-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 22px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: all .25s ease;
    }
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.09);
      border-color: var(--accent);
    }

    .project-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .project-info { flex: 1; min-width: 0; }

    .project-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .project-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .project-badges { display: flex; gap: 6px; flex-wrap: wrap; }

    .badge-level {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 30px;
      background: var(--blue-light);
      color: var(--blue);
    }

    @media (max-width: 600px) {
      .project-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <a class="btn-back" href="modules.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      মডিউল
    </a>
    <h1 class="page-title">🚀 Amazing HTML Projects</h1>
  </div>

  <p class="intro-note">
    নিচের প্রতিটা প্রজেক্টেই সম্পূর্ণ কোড, বাংলা কমেন্ট, ব্রাউজার প্রিভিউ ও ধাপে ধাপে ব্যাখ্যা আছে। কার্ডে ক্লিক করে দেখো!
  </p>

  <!-- Project cards (built by JS from HTML_PROJECTS) -->
  <main class="project-grid" id="projectGrid" aria-label="প্রজেক্ট তালিকা">
    <!-- Populated below -->
  </main>

</div>

<script src="projects-data.js"></script>
<script>
  /**
   * প্রতিটা প্রজেক্ট কার্ডের সংক্ষিপ্ত বিবরণ — শুধু গ্রিড পেজেই দেখানো হয়।
   * পূর্ণাঙ্গ কোড/ব্যাখ্যা থাকে HTML_PROJECT_CONTENT-এ (projects-data.js),
   * যা project.html পেজে রেন্ডার হয়।
   */
  const PROJECT_DESCRIPTIONS = {
    1:  "নাম, ছবি ও সোশ্যাল লিংক দিয়ে একটা ছোট প্রোফাইল কার্ড — বেসিক ট্যাগ প্র্যাকটিস।",
    2:  "ধাপে ধাপে রেসিপি লেখা — অর্ডারড/আনঅর্ডারড লিস্ট প্র্যাকটিসের জন্য দারুণ।",
    3:  "একাধিক ছবি সাজিয়ে গ্যালারি — figure/figcaption ও img ট্যাগ প্র্যাকটিস।",
    4:  "শিক্ষা, অভিজ্ঞতা ও স্কিল সাজিয়ে একটা প্রফেশনাল রেজুমে পেজ।",
    5:  "একাধিক পেজ (Home, About, Contact) একে অপরের সাথে লিংক করা।",
    6:  "রেস্টুরেন্ট মেনু বা প্রাইস লিস্ট — টেবিল ট্যাগ প্র্যাকটিস।",
    7:  "নাম, ইমেইল, পাসওয়ার্ড ইনপুট সহ একটা রেজিস্ট্রেশন ফর্ম।",
    8:  "শিরোনাম, লেখক, তারিখ সহ একটা ব্লগ পোস্ট — সিমান্টিক ট্যাগ প্র্যাকটিস।",
    9:  "ভিডিও ও অডিও এমবেড করে একটা মিডিয়া পেজ।",
    10: "সব ধরনের ইনপুট টাইপ (radio, checkbox, range, select) সহ একটা ফিডব্যাক ফর্ম।",
    11: "header, nav, main, section, footer দিয়ে সম্পূর্ণ সিমান্টিক ল্যান্ডিং পেজ।",
    12: "নেভিগেশন, সেকশন ও ফর্ম মিলিয়ে একটা পূর্ণাঙ্গ পোর্টফোলিও ওয়েবসাইট।",
  };

  (function renderGrid() {
    const grid = document.getElementById('projectGrid');

    HTML_PROJECTS.forEach(proj => {
      const card = document.createElement('a');
      card.className = 'project-card';
      card.href = `project.html?id=${proj.id}`;

      card.innerHTML = `
        <div class="project-icon">${proj.icon}</div>
        <div class="project-info">
          <div class="project-title">${proj.title}</div>
          <div class="project-desc">${PROJECT_DESCRIPTIONS[proj.id] || ''}</div>
          <div class="project-badges"><span class="badge-level">${proj.level}</span></div>
        </div>
      `;

      grid.appendChild(card);
    });
  })();
</script>
</body>
</html>
